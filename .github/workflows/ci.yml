name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines, 24 is what the harness
        # ships. The fallback path for hosts without zstd only runs on 20, so the
        # matrix is the only place that path is exercised.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the plugin has no dependencies. `npm test` runs both
      # offline halves and validates the very command the README tells people to run.
      - run: npm test
